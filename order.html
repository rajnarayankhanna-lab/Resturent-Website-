<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant/order.html</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .pay-btn:active::after{
      content:"payment successfully ";
    }
    
    .pay-btn{
      background: #2DCE23;
      border-color: black;
      border-radius: 10px;
      font-size: 2em;
      margin-top: 10px;
    }
  </style>
</head>

<body>
<h1>Your Order</h1>
<form action="good.html">
    <fieldset>
      <legend>Personal Details</legend>
      
      
 <label for="Name">Name:</label> <input type="text" name="Name" id="Name" placeholder="your name" required/>
 
  <br>
  
  <lable for="number">Mobile no.</label> <input type="number" name="number" id="number" placeholder="Mobile No." required>
  
  <br>
  
 <label for="Email">Email:</lable><input type="email" name="Email" id="Email"  placeholder="example.@gmail.com" />
 
<br>

      <label for="address">Address:</lable><input type="text" name="address" id="address"placeholder="address" required>
      
  </fieldset>
  <fieldset>
    <legend>Order details</legend>
    
    
      <label for="items">Items number:</label>
      <select name="items" id="items">
        <option value="Items no."disabled selected>Items no.</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      </select>
      
      <br>
      
      <label for="instructions">instructions:<br>
      <input type="radio" name="instructions" id="instructions"/>No Onion
      </label>
      
      <br>
      
      <label for="">
      <input type="radio">  Extra Onion <br>
      <input type="radio" id="">Extra spicy 
    </fieldset>
    
    <fieldset>
      <legend>Payment</legend>
      <label for="payment">Cash on delivery</label> <input type="radio"name="payment" id="payment" required/><br>
      online payment<input type="radio" name="payment" id="payment" required>
      
      <br><br>
      
      <p><mark>If you choose online payment then you have to gave your account details otherwise no need</mark></p>
      
      <label for="account">Account No.</label><input type="text" name="account" id="account"placeholder="account no."/>
      
      <label for="password">password:</label><input type="password" name="password" id="password" />
      
      <br>
      
      <label for="card">Select Card:</label><select name="card" id="card">
        <option value="card" disabled selected>Card</option>
        
        <option value="Rupay">Rupay</option>
        
        <option value="MasterCard">MasterCard</option>
        
        <option value="Visa">Visa</option>
        
        </select>
        <br>
        
        <input type="submit" name="pay" id="pay" value="Pay Now" class="pay-btn">
</form>

</body>

</html>
